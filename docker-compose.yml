services:
  db:
    image: postgres:16
    container_name: rb_prospecta_db
    environment:
      POSTGRES_DB: rb_prospecta_dev
      POSTGRES_USER: rb_prospecta
      POSTGRES_PASSWORD: rb_prospecta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rb_prospecta -d rb_prospecta_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
